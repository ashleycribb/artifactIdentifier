[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s3a-scholar-classifier"
version = "0.1.0"
description = "Autonomous research artifact classifier and S3A ingestion agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "S3A Architecture Team" }
]
dependencies = [
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.0",
    "rdflib>=7.0.0",
    "jsonschema>=4.21.0",
    "tiktoken>=0.6.0",
    "click>=8.1.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]
llm = [
    "openai>=1.12.0"
]

[project.scripts]
s3a-agent = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
